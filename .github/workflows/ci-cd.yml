name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  PREFIX: ${{ github.repository_owner }}/irtdp

jobs:
  lint:
    name: Build & Type Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - incident-service
          - media-service
          - processing-service
          - notification-service
          - api-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Install system deps (media-service)
        if: matrix.service == 'media-service'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build service
        working-directory: services/${{ matrix.service }}
        run: npm run build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: irtdp_test
          POSTGRES_USER: irtdp
          POSTGRES_PASSWORD: irtdp_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        working-directory: services/analytics-service
        run: npm ci && npm test
        env:
          DATABASE_URL: postgresql://irtdp:irtdp_secret@localhost:5432/irtdp_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_key

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH

  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push'

    strategy:
      matrix:
        service:
          - auth-service
          - incident-service
          - media-service
          - processing-service
          - notification-service
          - api-gateway
          - frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 🔐 Login to GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🏷️ Image metadata
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/irtdp-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # 🔥 BUILD FIX (NO CACHE)
      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service == 'frontend' && 'frontend' || format('services/{0}', matrix.service) }}
          push: true
          no-cache: true         # 🔥 THIS FIXES YOUR ISSUE
          pull: true             # 🔥 ensures latest base image
          tags: ${{ steps.meta.outputs.tags }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'

    steps:
      - run: echo "Deploying to staging..."

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - run: echo "Deploying to production..."
