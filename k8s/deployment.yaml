apiVersion: v1
kind: Namespace
metadata:
  name: irtdp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: irtdp-config
  namespace: irtdp
data:
  NODE_ENV: "production"
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  AUTH_SERVICE_URL: "http://auth-service:3001"
  INCIDENT_SERVICE_URL: "http://incident-service:3002"
  MEDIA_SERVICE_URL: "http://media-service:3003"
  NOTIF_SERVICE_URL: "http://notification-service:3005"
  S3_BUCKET: "incident-media"
  AWS_REGION: "us-east-1"
---
apiVersion: v1
kind: Secret
metadata:
  name: irtdp-secrets
  namespace: irtdp
type: Opaque
stringData:
  DATABASE_URL: "postgresql://irtdp:irtdp_secret@postgres:5432/irtdp"
  REDIS_URL: "redis://:redis_secret@redis:6379"
  JWT_SECRET: "CHANGE_THIS_TO_A_SECURE_RANDOM_256BIT_KEY"
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "minioadmin123"
  S3_ENDPOINT: "http://minio:9000"
---
# AUTH SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: irtdp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/your-org/irtdp-auth-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
          envFrom:
            - configMapRef:
                name: irtdp-config
            - secretRef:
                name: irtdp-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: irtdp
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
---
# INCIDENT SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-service
  namespace: irtdp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: incident-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: incident-service
    spec:
      containers:
        - name: incident-service
          image: ghcr.io/your-org/irtdp-incident-service:latest
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
          envFrom:
            - configMapRef:
                name: irtdp-config
            - secretRef:
                name: irtdp-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: incident-service
  namespace: irtdp
spec:
  selector:
    app: incident-service
  ports:
    - port: 3002
      targetPort: 3002
---
# MEDIA SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: irtdp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: media-service
  template:
    metadata:
      labels:
        app: media-service
    spec:
      containers:
        - name: media-service
          image: ghcr.io/your-org/irtdp-media-service:latest
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
          envFrom:
            - configMapRef:
                name: irtdp-config
            - secretRef:
                name: irtdp-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: media-service
  namespace: irtdp
spec:
  selector:
    app: media-service
  ports:
    - port: 3003
      targetPort: 3003
---
# PROCESSING WORKERS
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-service
  namespace: irtdp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: processing-service
  template:
    metadata:
      labels:
        app: processing-service
    spec:
      containers:
        - name: processing-service
          image: ghcr.io/your-org/irtdp-processing-service:latest
          envFrom:
            - configMapRef:
                name: irtdp-config
            - secretRef:
                name: irtdp-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: processing-hpa
  namespace: irtdp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: processing-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# NOTIFICATION SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: irtdp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/your-org/irtdp-notification-service:latest
          ports:
            - containerPort: 3005
          env:
            - name: PORT
              value: "3005"
          envFrom:
            - configMapRef:
                name: irtdp-config
            - secretRef:
                name: irtdp-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: irtdp
spec:
  selector:
    app: notification-service
  ports:
    - port: 3005
      targetPort: 3005
---
# API GATEWAY
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: irtdp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/your-org/irtdp-api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: irtdp-config
            - secretRef:
                name: irtdp-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: irtdp
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: irtdp-ingress
  namespace: irtdp
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.irtdp.example.com
      secretName: irtdp-tls
  rules:
    - host: api.irtdp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
