x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── Infrastructure ─────────────────────────────
  postgres:
    image: postgis/postgis:15-3.3
    container_name: irtdp-postgres
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irtdp -d irtdp"]
      interval: 10s
      retries: 5
      start_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-irtdp}
      POSTGRES_USER: ${POSTGRES_USER:-irtdp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-irtdp_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    networks: [irtdp]

  redis:
    image: redis:7-alpine
    container_name: irtdp-redis
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 10s
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks: [irtdp]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: irtdp-elasticsearch
    restart: always
    logging: *default-logging
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks: [irtdp]

  minio:
    image: minio/minio:latest
    container_name: irtdp-minio
    restart: always
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks: [irtdp]

  # ─── Core Services ─────────────────────────────
  auth-service:
    build: ./services/auth-service
    container_name: irtdp-auth
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-irtdp}:${POSTGRES_PASSWORD:-irtdp_secret}@postgres:5432/${POSTGRES_DB:-irtdp}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production_32chars}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [irtdp]

  incident-service:
    build: ./services/incident-service
    container_name: irtdp-incident
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    environment:
      PORT: "3002"
      DATABASE_URL: postgresql://${POSTGRES_USER:-irtdp}:${POSTGRES_PASSWORD:-irtdp_secret}@postgres:5432/${POSTGRES_DB:-irtdp}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      AUTH_SERVICE_URL: http://auth-service:3001
      AUDIT_SERVICE_URL: http://audit-service:3006
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks: [irtdp]

  media-service:
    build: ./services/media-service
    container_name: irtdp-media
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:3003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    environment:
      PORT: "3003"
      DATABASE_URL: postgresql://${POSTGRES_USER:-irtdp}:${POSTGRES_PASSWORD:-irtdp_secret}@postgres:5432/${POSTGRES_DB:-irtdp}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      AUTH_SERVICE_URL: http://auth-service:3001
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      AWS_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: incident-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks: [irtdp]

  api-gateway:
    build: ./services/api-gateway
    container_name: irtdp-gateway
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    environment:
      PORT: "8080"
      AUTH_SERVICE_URL: http://auth-service:3001
      INCIDENT_SERVICE_URL: http://incident-service:3002
      MEDIA_SERVICE_URL: http://media-service:3003
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production_32chars}
      ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      incident-service:
        condition: service_healthy
    networks: [irtdp]

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  irtdp:
    driver: bridge
